<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家用雲帳本</title>
  
  <link rel="icon" href="icon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="icon.ico">
  <link rel="manifest" id="manifest-link">
  
  <!-- 載入 Chart.js 供圖表使用 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // ======== 1. 動態生成 Manifest (Blob) ========
    let baseUrl = window.location.href.split('?')[0].replace(/index\.html$/, '');
    if (!baseUrl.endsWith('/')) baseUrl += '/';
    const absoluteIconUrl = new URL('icon.ico', baseUrl).href;
    const startUrl = new URL('./index.html', baseUrl).href;

    const manifest = {
      "name": "家用雲帳本",
      "short_name": "家用雲帳本",
      "start_url": startUrl,
      "display": "standalone",
      "background_color": "#f2f2f7",
      "theme_color": "#34A853",
      "icons": [
        {
          "src": absoluteIconUrl,
          "sizes": "192x192 512x512",
          "type": "image/x-icon",
          "purpose": "any maskable"
        },
        {
          "src": "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334A853'/%3E%3Ctext x='50' y='55' font-size='20' text-anchor='middle' fill='%23FFF' font-family='sans-serif'%3E帳本%3C/text%3E%3C/svg%3E",
          "sizes": "192x192",
          "type": "image/svg+xml",
          "purpose": "any"
        }
      ]
    };
    
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

    // ======== 2. 動態生成與註冊 Service Worker ========
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => {
          e.respondWith(
            fetch(e.request).catch(() => {
              if (e.request.url.includes('exec')) {
                const fallbackJSON = JSON.stringify({ status: 'error', message: '目前處於離線狀態，請檢查網路連線' });
                return new Response(fallbackJSON, { headers: { 'Content-Type': 'application/json' } });
              }
              return new Response('目前處於離線狀態');
            })
          );
        });
      `;
      const swBlob = new Blob([swCode], {type: 'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(swUrl).catch(err => console.error('❌ SW 註冊失敗:', err));
      });
    }
  </script>

  <style>
    /* 🌟 全域樣式設定 */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f0f2f5; margin: 0; padding: 0; 
      display: flex; flex-direction: column; align-items: center; font-size: 16px; 
    }

      background-color: #34A853; color: white;

    .card {

    .tab.active { background: #007AFF; color: white; }
    
    .view-section { display: none; }
    .view-section.active { display: block; }

    label { display: block; margin-top: 15px; font-weight: bold; color: #555; font-size: 18px; }
    input, select { width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 20px; background: #fafafa; }
    input:focus, select:focus { outline: none; border-color: #007AFF; background: white; }
    
    button { width: 100%; padding: 16px; background: #007AFF; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    button.sync-btn { margin-top: 10px; font-size: 16px; padding: 12px; } 

    #installAppBtn { background: #E8F5E9; color: #2E7D32; border: 2px solid #34A853; margin-top: 0; margin-bottom: 20px; display: none; animation: popIn 0.5s ease-out; }

    @keyframes popIn {

    }
    .quick-tags span:active { transform: scale(0.95); background: #C8E6C9; }

    /* 🌟 全域狀態提示 */
    .global-loading { display: none; text-align: center; margin-bottom: 15px; font-weight: bold; color: #E02020; font-size: 16px; }

    /* 🌟 查詢列表 (高度 65vh) */
    .result-box { margin-top: 15px; max-height: 65vh; overflow-y: auto; padding-bottom: 80px; }
    .result-item { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #34C759; font-size: 18px; transition: 0.1s; }

    .result-amount { font-weight: bold; color: #E02020; font-size: 22px; margin-top: 8px; }

    .result-month { font-size: 16px; color: #888; margin-bottom: 6px; }
    
    /* 🌟 長按多選加總專屬浮動面板 */
    .multi-select-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); color: white;

      z-index: 2000; display: none; justify-content: space-between; align-items: center;
      width: 85%; max-width: 400px; animation: slideUp 0.3s ease-out; font-size: 18px;
    }
    @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    .multi-select-bar button { margin: 0; padding: 8px 15px; font-size: 16px; background: rgba(255,255,255,0.2); width: auto; }

    /* 管理面板 (Modal) 樣式 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }

    .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; color: #333; text-align: center; }
    .modal-list { max-height: 250px; overflow-y: auto; margin-bottom: 15px; background: #fafafa; border-radius: 8px; padding: 5px; }
    .modal-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; font-size: 18px; }
    .modal-list-item:last-child { border-bottom: none; }
    .delete-btn { color: #E02020; cursor: pointer; font-weight: bold; padding: 5px; font-size: 22px; }
    .add-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .add-row input { margin-top: 0; flex: 1; font-size: 18px; }
    .add-row button { margin-top: 0; width: auto; background: #34A853; padding: 12px 20px; font-size: 18px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { margin-top: 0; flex: 1; padding: 14px; font-size: 18px; }
    .btn-cancel { background: #E0E0E0; color: #333; }

    /* 🧮 計算機專屬樣式 */
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .calc-btn { background: #f8f9fa; color: #333; font-size: 28px; font-weight: bold; padding: 16px 0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: 0.1s; margin-top: 0; }
    .calc-btn:active { background: #e2e6ea; transform: scale(0.95); }
    .calc-op { background: #FFF3E0; color: #E65100; border-color: #FFE0B2; }
    .calc-op:active { background: #FFE0B2; }
    .calc-clear { background: #FFEBEE; color: #C62828; border-color: #FFCDD2; }
    .calc-eval { background: #E8F5E9; color: #2E7D32; border-color: #C8E6C9; }
    #calcDisplay { background: #f0f2f5; padding: 15px; text-align: right; font-size: 34px; font-weight: bold; border-radius: 8px; margin-bottom: 15px; min-height: 40px; word-break: break-all; color: #333; }
    
    .chart-container { margin-top: 20px; position: relative; height: 300px; width: 100%; }
  </style>
</head>

  <script>
    document.getElementById('dateInput').valueAsDate = new Date();
    // ⚠ 請確認這是你最新部署的 GAS API URL
    const apiUrl = "https://script.google.com/macros/s/AKfycbxvVEOlqWPu-MraLhOcOp2OkAX0zD5tOLJFwlbHkqtWQAu9MRBh4I3ek4U9yn0jfevl/exec";
    let localLedgerData = [];
    let expenseChartInstance = null; 

    // ======== 🌟 帳本切換與狀態管理 ========
    let currentLedger = 'home'; 

    function getStoreKey(keyName) {
      return currentLedger === 'home' ? keyName : keyName + '_studio';
    }

    function toggleLedger() {
      currentLedger = currentLedger === 'home' ? 'studio' : 'home';
      
      const header = document.getElementById('appHeader');
      const title = document.getElementById('headerTitle');
      
      if (currentLedger === 'studio') {
        header.style.backgroundColor = '#5E5CE6'; 
        title.innerText = '工作室帳本';
      } else {
        header.style.backgroundColor = '#34A853'; 
        title.innerText = '家用雲帳本';
      }

      loadCategories(); loadQuickTags(); loadLocalData();
      if (document.querySelectorAll('.tab')[2].classList.contains('active')) {
        populateChartMonthSelect(); renderChart();
      }
    }

    // ======== PWA 安裝邏輯 ========
    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e; installAppBtn.style.display = 'block';
    });
    installAppBtn.addEventListener('click', async () => {
      if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; installAppBtn.style.display = 'none'; deferredPrompt = null; }
    });

    // ======== 🌟 長按多選加總 (核心邏輯) ========
    let pressTimer = null;
    let isLongPress = false;
    let multiSelectMode = false;
    let selectedItemsMap = new Map(); // 記錄 uniqueKey -> amount

    function startPress(e, domId, uniqueKey, amount) {
      isLongPress = false;
      pressTimer = setTimeout(() => {
        isLongPress = true;
        if (navigator.vibrate) navigator.vibrate(50); // 手機震動回饋
        if (!multiSelectMode) {
          multiSelectMode = true;
          document.getElementById('multiSelectBar').style.display = 'flex';
        }
        toggleSelection(domId, uniqueKey, amount);
      }, 500); // 0.5 秒觸發
    }

    function endPress(e) {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }

    function itemClick(e, domId, uniqueKey, itemStr) {
      if (isLongPress) return; 
      
      if (multiSelectMode) {
        const amt = parseFloat(JSON.parse(decodeURIComponent(itemStr)).amount.toString().replace(/,/g, '')) || 0;
        toggleSelection(domId, uniqueKey, amt);
      } else {
        openEditModal(itemStr);
      }
    }

    function toggleSelection(domId, uniqueKey, amount) {
      const el = document.getElementById(domId);
      if (selectedItemsMap.has(uniqueKey)) {
        selectedItemsMap.delete(uniqueKey);
        if (el) {
          el.style.backgroundColor = "";
          el.style.borderLeft = "4px solid #34C759";
        }
      } else {
        selectedItemsMap.set(uniqueKey, amount);
        if (el) {
          el.style.backgroundColor = "#E3F2FD";
          el.style.borderLeft = "6px solid #007AFF";
        }
      }
      updateSumBar();
    }

    function updateSumBar() {
      let sum = 0;
      selectedItemsMap.forEach(amount => sum += amount);
      document.getElementById('selectCount').innerText = selectedItemsMap.size;
      document.getElementById('selectSum').innerText = sum.toLocaleString();
    }

    // ======== 備份與還原 ========
    function exportBackup(options = {}) {
      const silent = options.silent === true;
      if (!silent) {
        if (!confirm(`確定要將目前的「${currentLedger === 'home' ? '家用雲帳本' : '工作室帳本'}」下載為備份檔嗎？`)) return false;
      }

      try {
        const backupData = {
          ledgerData: localStorage.getItem(getStoreKey('myLedgerData')) || '[]',
          syncInfo: localStorage.getItem(getStoreKey('myLedgerSyncInfo')) || '',
          customTags: localStorage.getItem(getStoreKey('myCustomTags')) || defaultTags,
          customCategories: localStorage.getItem(getStoreKey('myCustomCategories')) || defaultCategories
        };

        const json = JSON.stringify(backupData);
        if (typeof json !== 'string') throw new Error('無法整理備份資料');

        const now = new Date();
        const timeStamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;
        const prefix = currentLedger === 'home' ? '家用雲帳本備份' : '工作室帳本備份';

        const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `${prefix}_${timeStamp}.json`;
        a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 30000);
        if (!silent) alert('✅ 備份檔已成功下載到您的裝置！');
        return true;
      } catch (err) {
        if (!silent) alert('❌ 備份匯出失敗：' + (err.message || '未知錯誤'));
        return false;
      }
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const ledgerName = currentLedger === 'home' ? '家用雲帳本' : '工作室帳本';
      if (!confirm(`確定要匯入備份檔「${file.name}」嗎？\n\n⚠️ 警告：這將會完全覆蓋目前設備上的【${ledgerName}】資料與設定！`)) {
        event.target.value = ''; return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.ledgerData !== undefined) {
            localStorage.setItem(getStoreKey('myLedgerData'), typeof data.ledgerData === 'string' ? data.ledgerData : JSON.stringify(data.ledgerData));
            if (data.syncInfo) localStorage.setItem(getStoreKey('myLedgerSyncInfo'), data.syncInfo);
            if (data.customTags) localStorage.setItem(getStoreKey('myCustomTags'), data.customTags);
            if (data.customCategories) localStorage.setItem(getStoreKey('myCustomCategories'), data.customCategories);

            alert('✅ 備份資料已成功匯入！系統將重新載入以套用最新資料。');
            location.reload(); 
          } else { alert('❌ 匯入失敗：這似乎不是有效的帳本備份檔！'); }
        } catch (err) { alert('❌ 匯入失敗：無法解析檔案內容！'); }
        event.target.value = ''; 
      };
      reader.readAsText(file);
    }

    function syncData(mode) {
      const currentTwYear = new Date().getFullYear() - 1911;
      let queue = [];
      
      if (mode === 'this_month') {
        queue.push({ year: currentTwYear.toString(), month: (new Date().getMonth() + 1) + "月" });
        document.getElementById('syncStatus').innerText = "🔄 正在極速更新本月...";
      } else if (mode === 'custom') {
        let y = document.getElementById('syncYearSelect').value;
        let m = document.getElementById('syncMonthSelect').value;
        if (m === "全部") {
          queue.push({ year: y, month: ["1月", "2月", "3月", "4月", "5月", "6月"] });
          queue.push({ year: y, month: ["7月", "8月", "9月", "10月", "11月", "12月"] });
        } else { queue.push({ year: y, month: m }); }
        document.getElementById('syncStatus').innerText = "🔄 任務建立中...";
      } else if (mode === 'all') {
        if(!confirm("歷年完整同步將以「半年為單位」批次下載資料，確定要執行嗎？")) return;
        for (let y = currentTwYear; y >= 102; y--) {
          queue.push({ year: y.toString(), month: ["1月", "2月", "3月", "4月", "5月", "6月"] });
          queue.push({ year: y.toString(), month: ["7月", "8月", "9月", "10月", "11月", "12月"] });
        }
        document.getElementById('syncStatus').innerText = "🔄 完整同步排程中...";
      }
      executeSyncQueue(queue, mode);
    }

    async function executeSyncQueue(queue, mode) {
      document.getElementById('globalLoading').style.display = 'block';
      const startTime = performance.now();
      let finalData = mode === 'all' ? [] : JSON.parse(localStorage.getItem(getStoreKey('myLedgerData')) || '[]');
      
      if (mode !== 'all') {
        queue.forEach(q => {
          if (Array.isArray(q.month)) {
            q.month.forEach(m => finalData = finalData.filter(item => item.month !== (q.year + "年 " + m)));
          } else {
            finalData = finalData.filter(item => item.month !== (q.year + "年 " + q.month));
          }
        });
      }

      for (let i = 0; i < queue.length; i++) {
        let q = queue[i];
        let monthLabel = Array.isArray(q.month) ? (q.month[0] === '1月' ? '上半年' : '下半年') : q.month;
        document.getElementById('globalLoading').innerText = `⏳ 正在抓取 ${q.year}年 ${monthLabel} (${i + 1}/${queue.length})...`;
        
        try {
          let res = await fetch(apiUrl, { method: "POST", body: JSON.stringify({ action: "sync_custom", targetYear: q.year, targetMonth: q.month, ledger: currentLedger }) });
          let text = await res.text(); 
          try {
            let json = JSON.parse(text);
            if (json.status === 'success' && json.data.length > 0) finalData = finalData.concat(json.data);
          } catch (e) { continue; }
        } catch (err) {}
      }

      const duration = ((performance.now() - startTime) / 1000).toFixed(1);
      localStorage.setItem(getStoreKey('myLedgerData'), JSON.stringify(finalData));
      localStorage.setItem(getStoreKey('myLedgerSyncInfo'), `上次同步：${new Date().toLocaleString()}\n(共 ${finalData.length} 筆，耗時 ${duration} 秒)`);
      
      alert(`✅ 同步完成！\n共更新了 ${finalData.length} 筆資料。`);
      loadLocalData(); 
      document.getElementById('globalLoading').style.display = 'none';
      document.getElementById('globalLoading').innerText = "⏳ 正在與雲端連線，請稍候...";
      document.getElementById('syncStatus').innerText = localStorage.getItem(getStoreKey('myLedgerSyncInfo'));
    }

    function loadLocalData() {
      const storedData = localStorage.getItem(getStoreKey('myLedgerData'));
      const syncInfo = localStorage.getItem(getStoreKey('myLedgerSyncInfo'));
      
      if (storedData && syncInfo) {
        localLedgerData = JSON.parse(storedData);
        document.getElementById('syncStatus').innerText = syncInfo; 
        updateDatalist(); filterLocalData(); 
      } else {
        localLedgerData = [];
        document.getElementById('syncStatus').innerText = "尚未同步，請點擊上方按鈕下載資料";
        document.getElementById('resultBox').innerHTML = '';
      }
    }

    function filterLocalData() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultBox = document.getElementById('resultBox');
      
      if (!keyword) { resultBox.innerHTML = ''; return; }
      if (localLedgerData.length === 0) { resultBox.innerHTML = '<div class="result-item">請先點擊「同步資料」下載帳本！</div>'; return; }

      let filtered = localLedgerData.filter(item => item.detail.toLowerCase().includes(keyword) || item.amount.toLowerCase().includes(keyword));
      
      filtered.sort((a, b) => {
        const getVal = obj => {
          let m = obj.detail.match(/^(\d{2,3})\/(\d{1,2})\/(\d{1,2})/);
          if(m) return m[1]*10000 + m[2]*100 + parseInt(m[3]);
          m = obj.month.match(/(\d+)年\s*(\d+)月/);
          return m ? m[1]*10000 + m[2]*100 : 0;
        };
        return getVal(b) - getVal(a);
      });

      if (filtered.length === 0) {
        resultBox.innerHTML = '<div class="result-item" style="text-align:center;">找不到符合的紀錄 🥲</div>';
      } else {
        resultBox.innerHTML = filtered.map((item, index) => {
          const safeItemStr = encodeURIComponent(JSON.stringify(item)); 
          const domId = `result-item-${index}`;
          const amt = parseFloat(item.amount.toString().replace(/,/g, '')) || 0;
          
          const uniqueKey = `${item.month}|${item.category}|${item.detail}|${item.amount}`;
          const isSelected = selectedItemsMap.has(uniqueKey);
          
          const bgStyle = isSelected ? "background: #E3F2FD;" : "";
          const borderStyle = isSelected ? "border-left: 6px solid #007AFF;" : "border-left: 4px solid #34C759;";

          return `
          <div id="${domId}" class="result-item" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; -webkit-user-select: none; ${bgStyle} ${borderStyle}"
               oncontextmenu="return false;"
               ontouchstart="startPress(event, '${domId}', '${uniqueKey}', ${amt})"
               ontouchend="endPress(event)"
               ontouchmove="endPress(event)"
               onmousedown="startPress(event, '${domId}', '${uniqueKey}', ${amt})"
               onmouseup="endPress(event)"
               onmouseleave="endPress(event)"
               onclick="itemClick(event, '${domId}', '${uniqueKey}', '${safeItemStr}')">
            <div style="flex: 1; padding-right: 10px; pointer-events: none;">
              <div class="result-month">📍 ${item.month}</div>
              <div style="font-size: 18px; line-height: 1.4;">
                ${item.category ? `<span class="result-category">${item.category}</span>` : ''} 
                ${item.detail}
              </div>
            </div>
            <div class="result-amount" style="margin-top: 0; text-align: right; white-space: nowrap; pointer-events: none;">$ ${item.amount}</div>
          </div>
        `}).join('');
      }
    }

    function saveEditRecord() {
      const data = {
        action: 'edit', ledger: currentLedger, month: document.getElementById('editMonth').value,
        oldCategory: document.getElementById('editOldCategory').value, oldDetail: document.getElementById('editOldDetail').value, oldAmount: document.getElementById('editOldAmount').value,

      .then(res => res.json()).then(res => {

            localStorage.setItem(getStoreKey('myLedgerData'), JSON.stringify(localLedgerData)); filterLocalData(); updateDatalist();
          }

      }).finally(() => { document.getElementById('globalLoading').style.display = 'none'; });

    // ======== 📊 Chart.js 圖表邏輯 ========
    function populateChartMonthSelect() {
      const currentTwYear = new Date().getFullYear() - 1911;
      const currentMonthLabel = currentTwYear + "年 " + (new Date().getMonth() + 1) + "月";
      const months = new Set(localLedgerData.map(item => item.month)); months.add(currentMonthLabel); 
      const select = document.getElementById('chartMonthSelect'); const currentVal = select.value || currentMonthLabel; 
      
      select.innerHTML = '';
      Array.from(months).sort((a, b) => {
        const parseYM = str => { const m = str.match(/(\d+)年\s*(\d+)月/); return m ? parseInt(m[1]) * 100 + parseInt(m[2]) : 0; };
        return parseYM(b) - parseYM(a);
      }).forEach(m => select.appendChild(new Option(m, m)));
      
      if(Array.from(months).includes(currentVal)) select.value = currentVal;
    }

    function renderChart() {
      const selectedMonth = document.getElementById('chartMonthSelect').value; if(!selectedMonth) return;
      const categoryTotals = {}; let totalAmount = 0;
      
      localLedgerData.filter(item => item.month === selectedMonth).forEach(item => {
        let cat = item.category || "未分類"; let amt = parseFloat(item.amount.toString().replace(/,/g, '')) || 0;
        categoryTotals[cat] = (categoryTotals[cat] || 0) + amt; totalAmount += amt;
      });

      if (totalAmount === 0) {
        document.getElementById('chartTotalInfo').innerText = "該月份尚無記帳資料 🌵";
        if (expenseChartInstance) { expenseChartInstance.destroy(); expenseChartInstance = null; }
        return; 
      }

      document.getElementById('chartTotalInfo').innerText = `總支出: $ ${totalAmount.toLocaleString()} 元`;
      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (expenseChartInstance) { expenseChartInstance.destroy(); }
      
      expenseChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: Object.keys(categoryTotals), datasets: [{ data: Object.values(categoryTotals), backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#8D6E63', '#26A69A', '#EC407A', '#AB47BC', '#78909C'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 16 } } } } }
      });
    }

    // ======== 🧮 計算機邏輯 ========
    let calcExpression = ''; let calcTargetInput = 'amountInput'; 

    function openCalcModal(targetId = 'amountInput') {
      calcTargetInput = targetId; document.getElementById('calcModal').style.display = 'flex';
      calcExpression = document.getElementById(calcTargetInput).value || ''; updateCalcDisplay();
    }
    function closeCalcModal() { document.getElementById('calcModal').style.display = 'none'; }
    function calcInput(val) { if (calcExpression === '0' && val !== '.') calcExpression = ''; calcExpression += val; updateCalcDisplay(); }
    function calcClear() { calcExpression = ''; updateCalcDisplay(); }
    function calcEval() {
      try {
        if (!calcExpression) return; if (!/^[\d+\-*/.]+$/.test(calcExpression)) throw new Error("無效字元");
        const result = new Function('return ' + calcExpression)(); calcExpression = Math.round(result * 100) / 100 + ''; updateCalcDisplay();
      } catch (e) { calcExpression = '錯誤'; updateCalcDisplay(); setTimeout(calcClear, 1000); }
    }
    function confirmCalc() {
      if (/[+\-*/]/.test(calcExpression)) calcEval();
      if (calcExpression !== '錯誤' && calcExpression !== '') document.getElementById(calcTargetInput).value = calcExpression;
      closeCalcModal();
    }
    function updateCalcDisplay() { document.getElementById('calcDisplay').innerText = calcExpression === '' ? '0' : calcExpression; }
  </script>
